name: Build, test and smoke-test NapThe

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    name: Check source and offline payment handling
    runs-on: ubuntu-24.04
    steps:
      - name: Check out NapThe source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up PHP 8.4
        uses: axolotl-pm/setup-php-action@b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
        with:
          php-version: '8.4'
          pm-version-major: '5'
      - name: Check PHP syntax
        run: find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test offline gateway and reward policy
        run: php tests/offline-contract.php
      - name: Check GitHub Actions syntax with pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            900919a84f2229bac68ca9cd4103ea297abc35e9689ebb842c6e34a3d1b01b0a "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/build.yml

  build:
    name: Analyze and build against API ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 5.0.0
            ref: b16cc69974d4e805d21e6328ab77c0e17cd7116d
          - label: 5.49.1
            ref: dfe0d07e48a9e8d5a4a242fa43ff1cd3b743a955
    uses: NhanAZ/DevTools/.github/workflows/build-plugin.yml@8d13a75aaf4f330fdbd93737d58be9cacc41e262
    with:
      php-version: '8.4'
      pm-version-major: '5'
      phpstan: max
      axolotl-ref: ${{ matrix.ref }}
      artifact-name: napthe-api-${{ matrix.label }}-${{ github.sha }}
      retention-days: 14

  runtime-smoke:
    name: Start NapThe on Axolotl-PM 5.49.1
    needs: [source-checks, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out NapThe source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up PHP 8.4 for Axolotl-PM
        uses: axolotl-pm/setup-php-action@b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
        with:
          php-version: '8.4'
          pm-version-major: '5'
      - name: Download the API 5.49.1 PHAR built by this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: napthe-api-5.49.1-${{ github.sha }}
          path: ${{ runner.temp }}/napthe-artifact
      - name: Download and verify the official Axolotl-PM server PHAR
        shell: bash
        env:
          SERVER_SHA256: b62ce263c079a00498a49cd3eab0bfa454f4ba195e5f9d62e32927cfc805c665
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/napthe-runtime"
          mkdir -p "$runtime/data/plugins"
          curl --fail --location --silent --show-error \
            https://github.com/axolotl-pm/PocketMine-MP/releases/download/5.49.1/PocketMine-MP.phar \
            --output "$runtime/PocketMine-MP.phar"
          printf '%s  %s\n' "$SERVER_SHA256" "$runtime/PocketMine-MP.phar" | sha256sum --check --status
          cp "$RUNNER_TEMP/napthe-artifact/NapThe.phar" "$runtime/data/plugins/NapThe.phar"
          php "$runtime/PocketMine-MP.phar" --no-wizard --disable-ansi \
            --data="$runtime/data" --plugins="$runtime/data/plugins" > "$runtime/server.log" 2>&1 &
          server_pid=$!
          enabled=0
          ready=0
          for _ in $(seq 1 90); do
            if grep -Fq 'Enabling NapThe v0.2.0' "$runtime/server.log"; then enabled=1; fi
            if grep -Fq 'Done (' "$runtime/server.log"; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$runtime/server.log"; exit 1; fi
            sleep 1
          done
          if [ "$enabled" -ne 1 ] || [ "$ready" -ne 1 ]; then
            cat "$runtime/server.log"
            kill -INT "$server_pid" 2>/dev/null || true
            wait "$server_pid" || true
            exit 1
          fi
          kill -INT "$server_pid"
          for _ in $(seq 1 30); do
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$server_pid" 2>/dev/null; then kill "$server_pid"; cat "$runtime/server.log"; exit 1; fi
          wait "$server_pid"
          if grep -E '\[(ERROR|CRITICAL)\]' "$runtime/server.log"; then exit 1; fi
          cat "$runtime/server.log"
